<head>

<meta name="apple-mobile-web-app-capable" content="yes"/>

<meta name="apple-mobile-web-app-title" content="Ayush"/>

<meta name="description" content="Sacred lifespan clock — your heartbeats remaining"/>

<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet"/></noscript>
<style>
/* ── RESET & VARS ── */
:root{
  --bg:#04010a;
  --gold:#c8942a;
  --gold-hi:#f0c04a;
  --gold-dim:#5a3e10;
  --text:#e8dcc4;
  --text-dim:#4a3a22;
  --red:#cc2200;
  --red-hi:#ff3c1a;
  --ac:#c8942a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  overflow:hidden;user-select:none;font-family:'Noto Serif Devanagari',serif}

/* ── STARS ── */
#stars-c{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── HEARTBEAT VIGNETTE ── */
#hb-vignette{display:none}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;transition:opacity .4s,transform .4s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97)}

/* ═══════════ LANG SCREEN ═══════════ */
#lang-screen{
  background:radial-gradient(ellipse at 50% 20%,rgba(200,148,42,.08),transparent 65%);
}
.lang-om{
  font-family:'Tiro Devanagari Sanskrit',serif;
  font-size:clamp(3.5rem,14vw,6rem);line-height:1;text-align:center;
  color:var(--gold);
  filter:drop-shadow(0 0 28px rgba(200,148,42,.6));
  animation:omBreathe 4s ease-in-out infinite;
}
@keyframes omBreathe{
  0%,100%{filter:drop-shadow(0 0 18px rgba(200,148,42,.4))}
  50%{filter:drop-shadow(0 0 50px rgba(240,192,74,.95))}
}
.lang-hint{
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:clamp(.65rem,2.3vw,.85rem);color:var(--gold-dim);
  letter-spacing:.24em;margin:6px 0 22px;text-align:center;
}
.lang-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  width:100%;max-width:480px;max-height:56vh;overflow-y:auto;padding-right:2px;
}
.lang-grid::-webkit-scrollbar{width:3px}
.lang-grid::-webkit-scrollbar-thumb{background:rgba(200,148,42,.3);border-radius:4px}
.lang-btn{
  background:rgba(255,255,255,.025);border:1px solid rgba(200,148,42,.14);
  border-radius:12px;padding:11px 6px;cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.lang-btn:hover,.lang-btn.sel{
  background:rgba(200,148,42,.12);border-color:var(--gold);
  box-shadow:0 0 14px rgba(200,148,42,.18);
}
.ln{font-size:clamp(.95rem,3.8vw,1.18rem);color:var(--text);line-height:1.2;text-align:center}
.le{font-size:.54rem;letter-spacing:.1em;color:var(--text-dim);
  font-family:'Cinzel Decorative',serif;text-transform:uppercase}

/* ═══════════ SETUP SCREEN ═══════════ */
#setup{
  background:radial-gradient(ellipse at 50% 25%,rgba(200,148,42,.06),transparent 70%);
}
.s-om{
  font-family:'Tiro Devanagari Sanskrit',serif;
  font-size:clamp(3rem,10vw,5rem);line-height:1;text-align:center;
  color:var(--gold);filter:drop-shadow(0 0 24px rgba(200,148,42,.5));
  animation:omBreathe 4s ease-in-out infinite;margin-bottom:4px;
}
.s-sub{font-family:'IM Fell English',serif;font-style:italic;
  font-size:clamp(.65rem,2.4vw,.82rem);color:var(--gold-dim);
  letter-spacing:.2em;margin-bottom:18px;text-align:center;}
.card{
  background:rgba(255,255,255,.02);border:1px solid rgba(200,148,42,.14);
  border-radius:18px;padding:22px 20px 18px;width:100%;max-width:420px;
  backdrop-filter:blur(16px);
  box-shadow:0 8px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(200,148,42,.07);
}
.fg{margin-bottom:14px}
.fl{display:flex;gap:10px}.fl .fg{flex:1}
.lbl{display:block;margin-bottom:5px}
.ld{display:block;font-size:clamp(.76rem,3vw,.96rem);color:var(--gold);line-height:1.3}
.ls{display:block;font-size:.54rem;letter-spacing:.14em;color:var(--gold-dim);
  text-transform:uppercase;margin-top:1px}
.fi{
  width:100%;background:rgba(0,0,0,.5);
  border:1px solid rgba(200,148,42,.18);border-radius:10px;
  padding:11px 13px;color:var(--text);font-size:.9rem;
  outline:none;transition:border-color .22s,box-shadow .22s;-webkit-appearance:none;
}
.fi:focus{border-color:rgba(200,148,42,.6);box-shadow:0 0 0 3px rgba(200,148,42,.1)}
.fi::placeholder{color:var(--text-dim)}
input[type="date"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(.5) sepia(1) saturate(3) hue-rotate(5deg);cursor:pointer}
.pre-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pre-btn{
  background:rgba(200,148,42,.07);border:1px solid rgba(200,148,42,.18);
  border-radius:20px;padding:4px 11px;font-size:.64rem;color:var(--gold);
  cursor:pointer;transition:all .18s;
}
.pre-btn:hover,.pre-btn.on{background:rgba(200,148,42,.2);border-color:var(--gold)}
.bpm-note{font-family:'IM Fell English',serif;font-style:italic;
  font-size:.64rem;color:var(--text-dim);margin-top:3px}
.err{font-family:'IM Fell English',serif;font-style:italic;
  font-size:.7rem;color:var(--red-hi);min-height:13px;margin-top:4px}
.begin-btn{
  width:100%;padding:14px;margin-top:5px;
  background:linear-gradient(135deg,#5a3a06,#c8942a,#5a3a06);
  border:none;border-radius:12px;
  font-size:clamp(.82rem,3.4vw,.98rem);font-weight:700;
  letter-spacing:.08em;color:#04010a;cursor:pointer;
  transition:all .3s;box-shadow:0 4px 22px rgba(200,148,42,.28);
  position:relative;overflow:hidden;
}
.begin-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-100%);transition:transform .4s;
}
.begin-btn:hover{transform:translateY(-1px);box-shadow:0 6px 32px rgba(200,148,42,.48)}
.begin-btn:hover::after{transform:translateX(100%)}
.chg-lang{
  background:transparent;border:none;color:var(--gold-dim);
  font-size:.58rem;letter-spacing:.14em;cursor:pointer;margin-top:10px;
  text-decoration:underline;text-underline-offset:3px;text-transform:uppercase;
}
.chg-lang:hover{color:var(--gold)}

/* ═══════════ CLOCK SCREEN ═══════════ */
#clock{padding:0;justify-content:space-between}

/* Top bar */




/* ── CENTRE ── */
#centre{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;width:100%;padding:0 14px;
  gap:0;
}

/* ── MAIN LABEL ── */
.ctr-lbl{
  font-size:clamp(.6rem,2.2vw,.78rem);letter-spacing:.25em;
  color:var(--text);text-transform:uppercase;
  margin-bottom:8px;text-align:center;
  font-family:'Noto Sans Devanagari',sans-serif;
}

/* ── THE NUMBER ── */
#num-wrap{
  display:flex;align-items:baseline;justify-content:center;
  flex-wrap:nowrap;gap:0;width:100%;
  line-height:1;
}
/* stable digits (white-gold) */
.nd{
  font-family:'Noto Serif Devanagari',serif;
  font-size:clamp(2.4rem,10.5vw,5.4rem);
  font-weight:700;
  color:#e8dcc4;
  letter-spacing:-.01em;
  line-height:1;
  display:inline-block;
  transition:none;
}
/* separator commas */
.nc{
  font-family:'Noto Serif Devanagari',serif;
  font-size:clamp(1.6rem,7vw,3.6rem);
  font-weight:400;
  color:var(--gold-dim);
  line-height:1;
  display:inline-block;
  padding:0 1px;
}


/* ── UNIT ── */
.ctr-unit{
  font-size:clamp(.6rem,2.2vw,.78rem);letter-spacing:.18em;
  color:var(--text);text-transform:uppercase;
  margin-top:6px;text-align:center;line-height:1.7;
  font-family:'Noto Sans Devanagari',sans-serif;
}

/* ── PROGRESS ── */
#prog-wrap{width:min(88vw,360px);margin-top:16px}
.prog-row{display:flex;justify-content:space-between;
  font-size:.7rem;letter-spacing:.1em;color:var(--text);margin-bottom:5px;
  font-family:'Noto Sans Devanagari',sans-serif}
#prog-track{height:3px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
#prog-fill{
  height:100%;border-radius:4px;
  transition:width .9s linear,background .8s;
}

/* ── QUOTE ── */
#quote-wrap{
  text-align:center;padding:0 10px;margin-top:12px;
  min-height:58px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
#q-skt{
  font-family:'Tiro Devanagari Sanskrit',serif;
  font-size:clamp(.8rem,3.6vw,1.08rem);
  color:var(--gold);line-height:1.5;
  filter:drop-shadow(0 0 8px rgba(200,148,42,.4));
}
#q-src{
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:clamp(.52rem,2vw,.68rem);
  color:var(--gold);opacity:.8;letter-spacing:.08em;margin-top:2px;
}
#q-tr{
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:clamp(.56rem,2.2vw,.74rem);
  color:var(--text);opacity:.8;letter-spacing:.03em;line-height:1.5;
}
/* fade in/out on quote change */
.q-fade-in{animation:qIn .6s ease forwards}
.q-fade-out{animation:qOut .4s ease forwards}
@keyframes qIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes qOut{from{opacity:1}to{opacity:0}}



::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<canvas id="stars-c"></canvas>
<div id="hb-vignette"></div>

<!-- ══ LANGUAGE SCREEN ══ -->
<div class="screen" id="lang-screen">
  <div class="lang-om">ॐ</div>
  <div class="lang-hint">भाषा चुनें · SELECT YOUR LANGUAGE</div>
  <div class="lang-grid" id="lang-grid"></div>
</div>

<!-- ══ SETUP SCREEN ══ -->
<div class="screen hidden" id="setup">
  <div class="s-om">आयुष</div>
  <div class="s-sub" id="s-sub">Sacred Lifespan Clock</div>
  <div class="card" id="setup-card">
    <div class="fg">
      <label class="lbl">
        <span class="ld" id="l-dob-d">जन्म तिथि</span>
        <span class="ls" id="l-dob-s">Date of Birth</span>
      </label>
      <input class="fi" type="date" id="birthdate"/>
    </div>
    <div class="fl">
      <div class="fg">
        <label class="lbl">
          <span class="ld" id="l-age-d">अपेक्षित आयु (वर्ष)</span>
          <span class="ls" id="l-age-s">Expected Lifespan</span>
        </label>
        <input class="fi" type="number" id="exp-age" placeholder="75" min="1" max="150"/>
        <div class="pre-row">
          <button class="pre-btn" data-a="60">60</button>
          <button class="pre-btn" data-a="75">75</button>
          <button class="pre-btn on" data-a="100" id="purna-btn">पूर्ण १००</button>
          <button class="pre-btn" data-a="120">120</button>
        </div>
      </div>
      <div class="fg">
        <label class="lbl">
          <span class="ld" id="l-bpm-d">हृदयगति</span>
          <span class="ls" id="l-bpm-s">BPM (optional)</span>
        </label>
        <input class="fi" type="number" id="cust-bpm" placeholder="auto" min="40" max="200"/>
        <div class="bpm-note" id="bpm-note">Leave blank — age-accurate</div>
      </div>
    </div>
    <div class="err" id="err-msg"></div>
    <button class="begin-btn" id="begin-btn">▶ BEGIN YOUR AYUSH</button>
  </div>
  <button class="chg-lang" id="chg-lang-btn">🌐 Change Language</button>
</div>

<!-- ══ CLOCK SCREEN ══ -->
<div class="screen hidden" id="clock">





  <!-- Main Counter -->
  <div id="centre">
    <div class="ctr-lbl" id="ctr-lbl">शेष हृदयस्पंदन</div>

    <!-- THE NUMBER — built dynamically -->
    <div id="num-wrap"></div>

    <div class="ctr-unit" id="ctr-unit">प्राण · शेष धड़कनें</div>

    <!-- Progress bar -->
    <div id="prog-wrap">
      <div class="prog-row">
        <span id="p-birth">जन्म</span>
        <span id="p-pct">0%</span>
        <span id="p-moksha">मोक्ष</span>
      </div>
      <div id="prog-track"><div id="prog-fill" style="width:0%"></div></div>
    </div>

    <!-- Quote -->
    <div id="quote-wrap">
      <div id="q-skt">ॐ</div>
      <div id="q-src">—</div>
      <div id="q-tr">—</div>
    </div>
  </div>


</div>

<script>
// ════════════════════════════════════════════
// QUOTES — Bhagavad Gita + Mahabharata + Upanishads

":"महाभारत — वनपर्व","h":"जो धर्म को मारता है, धर्म उसे मार देता है; जो धर्म की रक्षा करता है, धर्म उसकी रक्षा करता है।","e":"Dharma, when destroyed, destroys; when protected, protects."},{"s":"सत्यमेव जयते नानृतं सत्येन पन्था विततो देवयानः","src":"महाभारत — वनपर्व","h":"सत्य की ही जय होती है, असत्य की नहीं — सत्य से देवयान मार्ग प्रशस्त होता है।","e":"Truth alone triumphs, not falsehood — through truth the divine path is opened."},{"s":"शरीरमाद्यं खलु धर्मसाधनम्","src":"महाभारत — वनपर्व","h":"शरीर ही धर्म का प्रथम साधन है।","e":"The body indeed is the primary instrument of dharma."},{"s":"आत्मा विजितः स्वर्गः पराजितस्तु नरकः","src":"महाभारत — शान्तिपर्व","h":"जीती हुई आत्मा स्वर्ग है और पराजित आत्मा नरक।","e":"The conquered self is heaven; the defeated self is hell."},{"s":"विद्वान् सर्वत्र पूज्यते","src":"महाभारत — शान्तिपर्व","h":"विद्वान की सर्वत्र पूजा होती है।","e":"The learned person is honored everywhere."},{"s":"क्षमा बलमशक्तानां शक्तानां भूषणं क्षमा","src":"महाभारत — उद्योगपर्व","h":"क्षमा कमज़ोरों का बल है और शक्तिशालियों का आभूषण।","e":"Forgiveness is the strength of the weak and the ornament of the strong."},{"s":"नास्ति सत्यसमो धर्मो नास्ति सत्यात् परं पदम्","src":"महाभारत — वनपर्व","h":"सत्य के समान धर्म नहीं है और सत्य से बड़ी कोई अवस्था नहीं।","e":"There is no dharma equal to truth; no state higher than truth."},{"s":"मातृवत्परदारेषु परद्रव्येषु लोष्टवत्","src":"महाभारत — शान्तिपर्व","h":"दूसरे की पत्नी को माता के समान और दूसरे के धन को मिट्टी के समान देखो।","e":"Regard another's wife as your mother and another's wealth as mere dust."},{"s":"न कश्चित् कस्यचिन्मित्रं न कश्चित् कस्यचिद्रिपुः","src":"महाभारत — उद्योगपर्व","h":"कोई किसी का न सच्चा मित्र है न शत्रु — कर्म ही मित्र-शत्रु बनाते हैं।","e":"No one is anyone's true friend or enemy — it is actions that create them."},{"s":"सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ","src":"महाभारत — भीष्मपर्व","h":"सुख-दुःख, लाभ-हानि, जय-पराजय को समान मानकर युद्ध करो।","e":"Treating pleasure and pain alike, gain and gs, but withdrawal brings the greatest fruit."},{"s":"एतद्वेदितव्यं हि यद्यस्मिन् काल आगते","src":"महाभारत — वनपर्व","h":"जिस समय जो जानना चाहिए वह जानना ही ज्ञान है।","e":"To know what should be known at the right time — that is wisdom."},{"s":"सर्वः परवशो दुःखी सर्व आत्मवशः सुखी","src":"महाभारत — शान्तिपर्व","h":"जो दूसरों के वश में है वह दुखी है और जो स्वयं के वश में है वह सुखी।","e":"All who are dependent on others are miserable; all who are self-mastered are happy."},{"s":"धर्मे चरतां क्लेशो दुर्लभं तप्यते","src":"महाभारत — वनपर्व","h":"धर्म में चलने वालों को कष्ट है — पर वह कष्ट तपस्या का दुर्लभ फल देता है।","e":"Following dharma brings hardship — but that hardship yields the rare fruit of austerity."},{"s":"जलबिन्दुनिपातेन क्रमशः पूर्यते घटः","src":"महाभारत — शान्तिपर्व","h":"जल की बूँदें गिरने से घड़ा धीरे-धीरे भर जाता है — ऐसे ही सब कर्तव्य करो।","e":"A pot is filled gradually by drops of water — so too all duties are fulfilled step by step."},{"s":"परोक्षे कार्यहन्तारं प्रत्यक्षे प्रियवादिनम्","src":"महाभारत — उद्योगपर्व","h":"जो पीठ पीछे काम बिगाड़े और सामने मीठा बोले — वह मित्र नहीं है।","e":"One who harms you behind your back but speaks sweetly to your face — is no true friend."},{"s":"तपस्स्वाध्यायनिरतं तपस्वी वाग्विदां वरम्","src":"वाल्मीकि रामायण — बालकाण्ड","h":"तपस्या और स्वाध्याय में निरत वाग्मियों में श्रेष्ठ तपस्वी को मैं नमन करता हूँ।","e":"I salute the ascetic devoted to austerity and study — the best among the eloquent."},{"s":"को नु अस्मिन्साम्प्रतं लोके गुणवान् कश्च वीर्यवान्","src":"वाल्मीकि रामायण — बालकाण्ड","h":"इस समय इस लोक में गुणवान, वीर्यवान, धर्मज्ञ और कृतज्ञ कौन है?","e":"Who in this world today is virtuous, mighty, righteous and grateful?"},{"s":"रामो विग्रहवान् धर्मः साधुः सत्यपराक्रमः","src":"वाल्मीकि रामायण — बालकाण्ड","h":"राम साक्षात् धर्म का विग्रह हैं — सज्जन और सत्य-पराक्रमी।","e":"Rama is the embodiment of dharma itself — noble and of true valor."},{"s":"अपि स्वर्णमयी लङ्का न मे लक्ष्मण रोचते","src":"वाल्मीकि रामायण — युद्धकाण्ड","h":"हे लक्ष्मण, सोने की लंका भी मुझे नहीं भाती — जननी और जन्मभूमि स्वर्ग से भी बढ़कर है।","e":"Even golden Lanka does not appeal to me — one's mother and motherland are greater than heaven."},{"s":"जननी जन्मभूमिश्च स्वर्गादपि गरीयसी","src":"वाल्मीकि रामायण — युद्धकाण्ड","h":"माँ और मातृभूमि स्वर्ग से भी श्रेष्ठ हैं।","e":"One's mother and motherland are superior even to heaven."},{"s":"न विना पुरुषव्याघ्रं सुखमेकापि शर्वरी","src":"वाल्मीकि रामायण — अयोध्याकाण्ड","h":"उस श्रेष्ठ पुरुष के बिना एक रात भी सुखपूर्वक नहीं बिती।","e":"Not a single night passes in happiness without that great man."},{"s":"धर्मात्मा सत्यसन्धश्च रामो दाशरथिर्यदि","src":"वाल्मीकि रामायण — अयोध्याकाण्ड","h":"यदि दशरथपुत्र राम धर्मात्मा और सत्यनिष्ठ हैं — तो मेरी बात मानें।","e":"If Rama, son of Dasharatha, is indeed righteous and true to his word — let him honor my request."},{"s":"एतावदुक्त्वा वचनं रामो धर्मभृतां वरः","src":"वाल्मीकि रामायण — अयोध्याकाण्ड","h":"धर्म के पालकों में श्रेष्ठ राम ने इतना कहकर वन को प्रस्थान किया।","e":"Saying these words, Rama — foremost among upholders of dharma — departed to the forest."},{"s":"न त्यजेयं कथञ्चन","src":"वाल्मीकि रामायण — अयोध्याकाण्ड","h":"मैं किसी भी परिस्थिति में अपना धर्म नहीं छोड़ूँगा।","e":"I shall not abandon my duty under any circumstance."},{"s":"पिता हि प्रथमो धर्मः","src":"वाल्मीकि रामायण — अयोध्याकाण्ड","h":"पिता की आज्ञा का पालन ही पहला धर्म है।","e":"The first duty is obedience to one's father."},{"s":"तृष्णां छिन्धि भव क्षेमी तृष्णाया नास्ति निष्कृतिः","src":"वाल्मीकि रामायण — अरण्यकाण्ड","h":"तृष्णा को काट डालो और शांत हो जाओ — तृष्णा का कोई अंत नहीं।","e":"Cut off desire and become peaceful — there is no end to craving."},{"s":"न जातु कामः कामानामुपभोगेन शाम्यति","src":"वाल्मीकि रामायण — अरण्यकाण्ड","h":"कभी भी कामनाएँ भोग से शांत नहीं होतीं — बल्कि घी से अग्नि की तरह बढ़ती हैं।","e":"Desire is never quenched by enjoyment — like fire fed with ghee, it only grows."},{"s":"रामं दशरथं विद्धि मां विद्धि जनकात्मजाम्","src":" function bpmA(a){return a<25?75:a<50?72:a<75?70:68}

function startClock(){
  const bd=document.getElementById('birthdate').value;
  const ea=parseFloat(document.getElementById('exp-age').value);
  const cb=parseFloat(document.getElementById('cust-bpm').value);
  const err=document.getElementById('err-msg');
  if(!bd){err.textContent=L.ed;return}
  const bdo=new Date(bd);
  if(isNaN(bdo)){err.textContent=L.ed;return}
  if(!ea||ea<1||ea>150){err.textContent=L.ea;return}
  const ay=(Date.now()-bdo)/(1000*60*60*24*365.25);
  if(ay<0){err.textContent=L.ef;return}
  if(ay>=ea){err.textContent=L.eo;return}
  err.textContent='';
  const bpm=(!isNaN(cb)&&cb>=40&&cb<=200)?cb:bpmA(ay);
  const tot=ea*365.25*24*60*bpm,bas=tot-ay*365.25*24*60*bpm,st=Date.now();
  try{localStorage.setItem('ayush5',JSON.stringify({bd,ea,cb:isNaN(cb)?'':cb,lang:CL}))}catch(e){}
  showS('clock');
  runClock({bdo,ea,bpm,bas,st});
}

// ════════════════════════════════════════════
// CLOCK ENGINE
// KEY INSIGHT: at 72 BPM = 1.2 beats/sec
//   • last digit  changes every ~0.83s  (10 / 12 beats)
//   • 2nd-last    changes every ~8.3s
//   • 3rd-last    changes every ~83s
// We track exact float beats and update DOM every beat interval
// ════════════════════════════════════════════
function runClock({bdo,ea,bpm,bas,st}){

  const secPerBeat=60/bpm;

  // Beat pulse — fire once per beat
  let lastBeatFloor=-1;

  // ── QUOTE SYSTEM ──
  // Quotes stored as {s:Sanskrit, src:source, h:Hindi, e:English}
  // Sequential order (Gita → Mahabharata → Ramayana → Upanishads → Chanakya)
  // ── OFFLINE TRANSLATION ──
  // All translations are embedded in quotes or resolved locally — zero network needed.
  // hi/mr/sa → q.h (Hindi/Marathi/Sanskrit) | en → q.e | others → q[lang] or English
  function getTranslation(q, lang){
    if(lang==='hi'||lang==='mr'||lang==='sa') return Promise.resolve(q.h);
    if(lang==='en') return Promise.resolve(q.e);
    // Use embedded translation if present on the quote object
    if(q[lang] && q[lang].length > 2) return Promise.resolve(q[lang]);
    // Fallback: show English (universally understood, better than random Hindi for non-Hindi speakers)
    return Promise.resolve(q.e);
  }

  let quoteOrder = Array.from({length:QUOTES.length},(_,i)=>i); // sequential

  function showQ(){
    const q=QUOTES[quoteOrder[qIdx % quoteOrder.length]];
    const wrap=document.getElementById('quote-wrap');
    wrap.classList.remove('q-fade-in');
    wrap.classList.add('q-fade-out');
    setTimeout(async ()=>{
      document.getElementById('q-skt').textContent=q.s;
      document.getElementById('q-src').textContent=q.src;
      // Show Hindi immediately while native translation loads
      const immediate = (CL === 'en') ? q.e : q.h;
      document.getElementById('q-tr').textContent=immediate;
      wrap.classList.remove('q-fade-out');
      wrap.classList.add('q-fade-in');
      // Fetch native translation async (already cached after first view)
      const native = await getTranslation(q, CL);
      document.getElementById('q-tr').textContent=native;
      qIdx++;
      // After full cycle, start over sequentially
      if(qIdx > 0 && qIdx % quoteOrder.length === 0){
        qIdx = 0;
      }
    },420);
  }
  showQ();
  qTimer=setInterval(showQ,30000);

  // Number DOM: build spans once
  const nw=document.getElementById('num-wrap');
  nw.innerHTML='';
  // We'll store refs to each digit span and comma spans
  // Number can be up to 10 digits: X,XXX,XXX,XXX
  // Positions 0-9 left to right; last 2 (pos 8,9) are red hot
  // We dynamically build based on magnitude
  let digitSpans=[];
  let lastRenderedStr='';

  function buildNumDOM(str){
    // str: digits only, no commas, e.g. "1350087280"
    nw.innerHTML='';
    digitSpans=[];
    const formatted=formatWithCommas(str);
    // Walk formatted string
    for(let i=0;i<formatted.length;i++){
      const ch=formatted[i];
      if(ch===','){
        const s=document.createElement('span');
        s.className='nc';s.textContent=',';
        nw.appendChild(s);
      } else {
        // is this one of the last 2 digits?
        // count digits position from right in original str
        const digitPosFromRight=str.length-1-(formatted.length-1-i-(formatted.slice(0,i).split(',').length));
        // simpler: track digit index
        const span=document.createElement('span');
        const rawIdx=digitSpans.length; // 0-based digit index from LEFT
        digitSpans.push(span);
        nw.appendChild(span);
      }
    }
    lastRenderedStr=str;
    refreshNumStyle(str);
  }

  function formatWithCommas(s){
    let r='';
    for(let i=0;i<s.length;i++){
      if(i>0&&(s.length-i)%3===0)r+=',';
      r+=s[i];
    }
    return r;
  }

  function refreshNumStyle(str){
    digitSpans.forEach((sp,i)=>{
      sp.textContent=str[i];
      sp.className='nd';
    });
  }

  function animateChangedDigits(oldStr,newStr){
    if(oldStr===newStr)return;
    if(oldStr.length!==newStr.length){
      buildNumDOM(newStr);
      return;
    }
    for(let i=0;i<newStr.length;i++){
      if(newStr[i]!==oldStr[i]){
        digitSpans[i].textContent=newStr[i];
        digitSpans[i].className='nd';
      }
    }
  }

  let prevStr='';
  let lastUpdateTime=0;

  function update(){
    const now=Date.now();
    const elSec=(now-st)/1000;
    const rem=Math.max(0,bas-elSec*bpm);
    const remFloor=Math.floor(rem);

    // Beat detection — kept for timing reference only
    const beatNum=Math.floor(elSec/secPerBeat);
    if(beatNum!==lastBeatFloor){
      lastBeatFloor=beatNum;
    }

    // ── Update number every ~0.25s (smooth enough, not blurring) ──
    // But ONLY the digits that actually changed since last frame
    // Last digit changes at bpm/60 per second = ~1.2x/sec
    // 2nd last at ~0.12x/sec — totally calm
    if(now-lastUpdateTime>=250){
      lastUpdateTime=now;

      const newStr=String(remFloor);

      if(newStr!==prevStr){
        if(!prevStr||prevStr.length!==newStr.length){
          buildNumDOM(newStr);
        } else {
          animateChangedDigits(prevStr,newStr);
        }
        prevStr=newStr;
      }

      // Life pct
      const nowAge=(now-bdo.getTime())/(1000*60*60*24*365.25);
      const lp=Math.min(1,nowAge/ea);
      const ai=Math.min(3,Math.floor(lp*4));

      if(ai!==lastAI){
        lastAI=ai;
        const ad=L.ash[ai];
        const ff=`'${L.f}',serif`;
        document.documentElement.style.setProperty('--ac',AC[ai]);

      }

      // Labels
      document.getElementById('ctr-lbl').textContent=L.lr;
